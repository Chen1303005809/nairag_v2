services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: nairag
      POSTGRES_USER: nairag
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nairag -d nairag"]
      interval: 5s
      timeout: 5s
      retries: 20
    secrets:
      - postgres_password
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data

  ocr:
    build:
      context: ./ocr_service
    environment:
      OCR_DEVICE: cpu
      OCR_MAX_IMAGE_BYTES: ${OCR_MAX_IMAGE_BYTES:-10485760}
      OCR_MAX_IMAGE_PIXELS: ${OCR_MAX_IMAGE_PIXELS:-20000000}
      OCR_CPU_THREADS: ${OCR_CPU_THREADS:-4}
      PADDLE_PDX_MODEL_SOURCE: ${PADDLE_PDX_MODEL_SOURCE:-BOS}
    volumes:
      - ocr_model_cache:/var/lib/nairag-ocr/model-cache
    expose:
      - "9003"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9003/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 2m

  api:
    build:
      context: ./backend
    command: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://nairag@postgres:5432/nairag
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_SECRET_FILE: /run/secrets/jwt_signing_key
      INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/initial_admin_password
      INITIAL_ADMIN_USERNAME: admin
      COOKIE_SECURE: "false"
      INDEX_ARTIFACT_DIR: /var/lib/nairag/index-artifacts
      INDEX_BACKEND_MODE: local_artifact
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-http://ocr:9003}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-60}
      OCR_MAX_IMAGE_BYTES: ${OCR_MAX_IMAGE_BYTES:-10485760}
      OCR_TICKET_TTL_SECONDS: ${OCR_TICKET_TTL_SECONDS:-600}
      OCR_KEYWORD_FALLBACK_MIN_CONFIDENCE: ${OCR_KEYWORD_FALLBACK_MIN_CONFIDENCE:-0.9}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_KEY: ${OPENAI_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_CONVERSATION_MESSAGES: ${LLM_MAX_CONVERSATION_MESSAGES:-200}
      LLM_MAX_CONVERSATION_CHARS: ${LLM_MAX_CONVERSATION_CHARS:-30000}
      ATTACHMENT_STORAGE_BACKEND: local
      ATTACHMENT_STORAGE_DIR: /var/lib/nairag/attachments
      ATTACHMENT_MAX_FILE_BYTES: ${ATTACHMENT_MAX_FILE_BYTES:-20971520}
    depends_on:
      postgres:
        condition: service_healthy
      ocr:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./volumes/index_artifacts:/var/lib/nairag/index-artifacts:ro
      - ./volumes/attachments:/var/lib/nairag/attachments
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    secrets:
      - postgres_password
      - jwt_signing_key
      - initial_admin_password

  web:
    build:
      context: ./web
      args:
        VITE_LLM_MAX_CONVERSATION_MESSAGES: ${LLM_MAX_CONVERSATION_MESSAGES:-200}
        VITE_LLM_MAX_CONVERSATION_CHARS: ${LLM_MAX_CONVERSATION_CHARS:-30000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ./backend
    command: python worker.py
    environment:
      APP_ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://nairag@postgres:5432/nairag
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_SECRET_FILE: /run/secrets/jwt_signing_key
      INDEX_ARTIFACT_DIR: /var/lib/nairag/index-artifacts
      INDEX_BACKEND_MODE: local_artifact
      WORKER_POLL_INTERVAL_SECONDS: "2"
      WORKER_LEASE_SECONDS: "300"
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_KEY: ${OPENAI_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_CONVERSATION_MESSAGES: ${LLM_MAX_CONVERSATION_MESSAGES:-200}
      LLM_MAX_CONVERSATION_CHARS: ${LLM_MAX_CONVERSATION_CHARS:-30000}
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./volumes/index_artifacts:/var/lib/nairag/index-artifacts
    secrets:
      - postgres_password
      - jwt_signing_key

volumes:
  ocr_model_cache:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_signing_key:
    file: ./secrets/jwt_signing_key.txt
  initial_admin_password:
    file: ./secrets/initial_admin_password.txt
