services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: nairag
      POSTGRES_USER: nairag
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nairag -d nairag"]
      interval: 5s
      timeout: 5s
      retries: 20
    secrets:
      - postgres_password
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data

  # Milvus standalone dependencies.  Keep these data directories separate from
  # the business attachment storage that will be added later.
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd -advertise-client-urls=http://milvus-etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - ./volumes/milvus/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  milvus-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_SECRET_ACCESS_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - ./volumes/milvus/minio:/minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  milvus:
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_REGION: us-east-1
    volumes:
      - ./volumes/milvus/data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5

  api:
    build:
      context: ./backend
    command: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://nairag@postgres:5432/nairag
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_SECRET_FILE: /run/secrets/jwt_signing_key
      INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/initial_admin_password
      INITIAL_ADMIN_USERNAME: admin
      COOKIE_SECURE: "false"
      INDEX_ARTIFACT_DIR: /var/lib/nairag/index-artifacts
      INDEX_BACKEND_MODE: ${INDEX_BACKEND_MODE:-local_artifact}
      EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      MILVUS_URL: ${MILVUS_URL:-http://milvus:19530}
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./volumes/index_artifacts:/var/lib/nairag/index-artifacts:ro
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    secrets:
      - postgres_password
      - jwt_signing_key
      - initial_admin_password

  web:
    build:
      context: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ./backend
    command: python worker.py
    environment:
      APP_ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://nairag@postgres:5432/nairag
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_SECRET_FILE: /run/secrets/jwt_signing_key
      INDEX_ARTIFACT_DIR: /var/lib/nairag/index-artifacts
      INDEX_BACKEND_MODE: ${INDEX_BACKEND_MODE:-local_artifact}
      EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      MILVUS_URL: ${MILVUS_URL:-}
      WORKER_POLL_INTERVAL_SECONDS: "2"
      WORKER_LEASE_SECONDS: "300"
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
      - ./volumes/index_artifacts:/var/lib/nairag/index-artifacts
    secrets:
      - postgres_password
      - jwt_signing_key

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_signing_key:
    file: ./secrets/jwt_signing_key.txt
  initial_admin_password:
    file: ./secrets/initial_admin_password.txt
