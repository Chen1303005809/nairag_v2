# Production overlay. Apply it together with docker-compose.yaml:
# docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up --build -d
#
# This requires a Linux x86_64 host with the NVIDIA Container Toolkit installed.
x-milvus-client-environment: &milvus-client-environment
  INDEX_BACKEND_MODE: milvus
  EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:?Set EMBEDDING_SERVICE_URL to the production OpenAI-compatible embedding endpoint}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
  MILVUS_URL: http://milvus:19530

services:
  # Milvus standalone dependencies are production-only; local development uses
  # the deterministic local_artifact index backend instead.
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd -advertise-client-urls=http://milvus-etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - ./volumes/milvus/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  milvus-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_SECRET_ACCESS_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - ./volumes/milvus/minio:/minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  milvus:
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_REGION: us-east-1
    volumes:
      - ./volumes/milvus/data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5

  ocr:
    build:
      dockerfile: Dockerfile.gpu
    environment:
      OCR_DEVICE: gpu:0
    gpus: all

  api:
    environment:
      <<: *milvus-client-environment
      APP_ENVIRONMENT: production
      COOKIE_SECURE: "true"
    depends_on:
      milvus:
        condition: service_healthy

  worker:
    environment:
      <<: *milvus-client-environment
      APP_ENVIRONMENT: production
      COOKIE_SECURE: "true"
    depends_on:
      milvus:
        condition: service_healthy
