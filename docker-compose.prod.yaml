# Production overlay. Apply it together with docker-compose.yaml:
# docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up --build -d
#
# This requires a Linux x86_64 host with the NVIDIA Container Toolkit installed.
x-milvus-client-environment: &milvus-client-environment
  INDEX_BACKEND_MODE: milvus
  EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:?Set EMBEDDING_SERVICE_URL to the production OpenAI-compatible embedding endpoint}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
  MILVUS_URL: http://milvus:19530

x-attachment-client-environment: &attachment-client-environment
  ATTACHMENT_STORAGE_BACKEND: minio
  ATTACHMENT_MINIO_ENDPOINT: milvus-minio:19000
  ATTACHMENT_MINIO_ACCESS_KEY_FILE: /run/secrets/attachment_minio_access_key
  ATTACHMENT_MINIO_SECRET_KEY_FILE: /run/secrets/attachment_minio_secret_key
  ATTACHMENT_MINIO_BUCKET: ${ATTACHMENT_MINIO_BUCKET:-nairag-attachments}
  ATTACHMENT_MINIO_SECURE: "false"

services:
  # Milvus standalone dependencies are production-only; local development uses
  # the deterministic local_artifact index backend instead.
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd -advertise-client-urls=http://milvus-etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - ./volumes/milvus/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  milvus-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_SECRET_ACCESS_KEY:-minioadmin}
    command: minio server /minio_data --address ":19000" --console-address ":9001"
    volumes:
      - ./volumes/milvus/minio:/minio_data
    ports:
      - "19000:19000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  milvus:
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:19000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_REGION: us-east-1
    volumes:
      - ./volumes/milvus/data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5

  attachment-minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_SECRET_ACCESS_KEY:-minioadmin}
      ATTACHMENT_MINIO_BUCKET: ${ATTACHMENT_MINIO_BUCKET:-nairag-attachments}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attachment_access_key="$$(cat /run/secrets/attachment_minio_access_key)"
        attachment_secret_key="$$(cat /run/secrets/attachment_minio_secret_key)"
        mc alias set storage http://milvus-minio:19000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "storage/$${ATTACHMENT_MINIO_BUCKET}"
        policy_file=/tmp/nairag-attachments-policy.json
        cat > "$${policy_file}" <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
              "Resource": ["arn:aws:s3:::$${ATTACHMENT_MINIO_BUCKET}"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
              "Resource": ["arn:aws:s3:::$${ATTACHMENT_MINIO_BUCKET}/*"]
            }
          ]
        }
        EOF
        if ! mc admin policy info storage nairag-attachments-rw >/dev/null 2>&1; then
          mc admin policy create storage nairag-attachments-rw "$${policy_file}"
        fi
        if ! mc admin user info storage "$${attachment_access_key}" >/dev/null 2>&1; then
          mc admin user add storage "$${attachment_access_key}" "$${attachment_secret_key}"
        fi
        mc admin policy attach storage nairag-attachments-rw --user "$${attachment_access_key}"
    depends_on:
      milvus-minio:
        condition: service_healthy
    secrets:
      - attachment_minio_access_key
      - attachment_minio_secret_key

  ocr:
    build:
      dockerfile: Dockerfile.gpu
    environment:
      OCR_DEVICE: gpu:0
    gpus: all

  api:
    environment:
      <<: [*milvus-client-environment, *attachment-client-environment]
      APP_ENVIRONMENT: production
      COOKIE_SECURE: "true"
    depends_on:
      milvus:
        condition: service_healthy
      attachment-minio-init:
        condition: service_completed_successfully
    secrets:
      - attachment_minio_access_key
      - attachment_minio_secret_key

  worker:
    environment:
      <<: [*milvus-client-environment, *attachment-client-environment]
      APP_ENVIRONMENT: production
      COOKIE_SECURE: "true"
    depends_on:
      milvus:
        condition: service_healthy
      attachment-minio-init:
        condition: service_completed_successfully
    secrets:
      - attachment_minio_access_key
      - attachment_minio_secret_key

secrets:
  attachment_minio_access_key:
    file: ./secrets/attachment_minio_access_key.txt
  attachment_minio_secret_key:
    file: ./secrets/attachment_minio_secret_key.txt
