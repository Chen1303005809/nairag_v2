[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nairag-api"
version = "0.1.0"
description = "Nairag V2 RAG knowledge-base API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.14.1",
  "argon2-cffi==23.1.0",
  "asyncpg==0.30.0",
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "minio==7.2.15",
  "python-multipart==0.0.20",
  "pydantic-settings==2.7.1",
  "PyJWT==2.10.1",
  "psycopg[binary]==3.2.4",
  "SQLAlchemy[asyncio]==2.0.37",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.21.0",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
  "ruff==0.9.3",
]

[tool.setuptools]
packages = ["app", "app.api", "app.api.routes", "app.core", "app.db", "app.models", "app.schemas", "app.services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
